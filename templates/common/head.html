{{ define "common/head" }}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            function applyTheme(pref) {
                var effective = pref;
                if (pref !== 'light' && pref !== 'dark') {
                    pref = 'system';
                    effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', effective);
                document.documentElement.setAttribute('data-theme-pref', pref);
                document.documentElement.style.colorScheme = effective;
            }
            var saved = 'system';
            try { saved = localStorage.getItem('gilos_theme') || 'system'; } catch (e) {}
            applyTheme(saved);
            window.__setTheme = function (pref) {
                try { localStorage.setItem('gilos_theme', pref); } catch (e) {}
                applyTheme(pref);
                window.dispatchEvent(new CustomEvent('gilos-theme-change', {
                    detail: { pref: pref, theme: document.documentElement.getAttribute('data-theme') }
                }));
            };
            if (window.matchMedia) {
                var mq = window.matchMedia('(prefers-color-scheme: dark)');
                var onChange = function () {
                    if ((document.documentElement.getAttribute('data-theme-pref') || 'system') === 'system') {
                        applyTheme('system');
                        window.dispatchEvent(new CustomEvent('gilos-theme-change', {
                            detail: { pref: 'system', theme: document.documentElement.getAttribute('data-theme') }
                        }));
                    }
                };
                if (mq.addEventListener) mq.addEventListener('change', onChange);
                else if (mq.addListener) mq.addListener(onChange);
            }
        })();
    </script>
    <link id="gilos-favicon" rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
    <script>
    (function () {
        function syncFavicon() {
            var link = document.getElementById('gilos-favicon');
            if (!link) return;
            var theme = document.documentElement.getAttribute('data-theme');
            var isDark = theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            link.href = isDark ? '/static/img/icon-dark.svg' : '/static/img/icon.svg';
        }
        syncFavicon();
        window.addEventListener('gilos-theme-change', syncFavicon);
        if (window.matchMedia) {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            if (mq.addEventListener) mq.addEventListener('change', syncFavicon);
        }
    })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@19.2.16/build/css/intlTelInput.css">
    <link rel="stylesheet" href="/static/css/app.css?v={{ if .AppVersion }}{{ .AppVersion }}{{ else }}1{{ end }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@19.2.16/build/js/intlTelInput.min.js"></script>
    <script src="/static/js/ui.js?v={{ if .AppVersion }}{{ .AppVersion }}{{ else }}1{{ end }}"></script>
{{ end }}
