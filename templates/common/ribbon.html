{{define "ribbon"}}
<div id="app-ribbon" class="app-ribbon" role="region" aria-label="{{ index .T "gilos_authenticator" }}">
    <div class="ribbon-inner">
        <div class="ribbon-brand">
            <img src="/static/img/app.svg" alt="{{ index .T "gilos_authenticator" }}" class="ribbon-icon">
            <div class="ribbon-text">
                <span class="ribbon-title">{{ index .T "gilos_authenticator" }}</span>
                <span class="ribbon-subtitle">{{ index .T "faster_access_better_security" }}</span>
            </div>
        </div>
        <div class="ribbon-actions">
            <a href="https://play.google.com/store/apps/details?id=org.gilos.auth" class="ribbon-cta" target="_blank" rel="noopener noreferrer">
                <span>{{ index .T "get_app" }}</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
            </a>
            <button type="button" class="ribbon-close" onclick="dismissAppRibbon()" aria-label="{{ index .T "close" }}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>
</div>
<script>
    (function () {
        if (sessionStorage.getItem('gilos_ribbon_dismissed') === '1') {
            var r = document.getElementById('app-ribbon');
            if (r) r.style.display = 'none';
        }
    })();
    function dismissAppRibbon() {
        var r = document.getElementById('app-ribbon');
        if (r) {
            r.style.opacity = '0';
            r.style.transform = 'translateY(-6px)';
            setTimeout(function () { r.style.display = 'none'; }, 180);
        }
        sessionStorage.setItem('gilos_ribbon_dismissed', '1');
    }
</script>
<style>
    .app-ribbon {
        width: 100%;
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border-subtle);
        transition: opacity 0.18s ease, transform 0.18s ease;
    }

    :root[data-theme="dark"] .app-ribbon {
        background: rgba(22, 22, 25, 0.85);
    }

    .ribbon-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 10px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .ribbon-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }

    .ribbon-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        flex-shrink: 0;
        object-fit: cover;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .ribbon-text {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
        min-width: 0;
    }

    .ribbon-title {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.01em;
    }

    .ribbon-subtitle {
        font-size: 0.825rem;
        color: var(--text-muted);
    }

    .ribbon-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
    }

    .ribbon-cta {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--primary);
        color: var(--primary-contrast);
        padding: 6px 13px;
        border-radius: var(--radius-pill);
        font-size: 0.8rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.16s ease, transform 0.12s ease;
    }

    .ribbon-cta:hover {
        background: var(--primary-gradient-hover);
        transform: translateY(-1px);
    }

    .ribbon-close {
        width: 28px;
        height: 28px;
        padding: 0;
        margin: 0;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
    }

    .ribbon-close:hover {
        background: var(--surface-subtle);
        color: var(--text);
    }

    @media (max-width: 600px) {
        .ribbon-inner {
            padding: 10px 16px;
        }
        .ribbon-subtitle {
            display: none;
        }
    }
</style>
{{end}}
