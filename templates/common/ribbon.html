{{define "ribbon"}}
<div id="app-ribbon" class="app-ribbon" role="region" aria-label="{{ index .T "gilos_authenticator" }}">
    <div class="ribbon-inner">
        <div class="ribbon-brand">
            <img src="/static/img/app.svg" alt="{{ index .T "gilos_authenticator" }}" class="ribbon-icon">
            <div class="ribbon-text">
                <span class="ribbon-title">{{ index .T "gilos_authenticator" }}</span>
                <span class="ribbon-subtitle">{{ index .T "faster_access_better_security" }}</span>
            </div>
        </div>
        <div class="ribbon-actions">
            <a href="https://play.google.com/store/apps/details?id=org.gilos.auth" class="ribbon-cta" target="_blank" rel="noopener noreferrer">
                <span>{{ index .T "get_app" }}</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
            </a>
            <button type="button" class="ribbon-close" onclick="dismissAppRibbon()" aria-label="{{ index .T "close" }}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>
</div>
<script>
    (function () {
        var dismissed = false;
        try {
            dismissed = localStorage.getItem('gilos_ribbon_dismissed') === '1' || sessionStorage.getItem('gilos_ribbon_dismissed') === '1';
        } catch (e) {}
        if (dismissed) {
            var r = document.getElementById('app-ribbon');
            if (r) r.style.display = 'none';
        }
    })();
    function dismissAppRibbon() {
        var r = document.getElementById('app-ribbon');
        if (r) {
            r.style.opacity = '0';
            r.style.transform = 'translateY(-4px)';
            setTimeout(function () { r.style.display = 'none'; }, 160);
        }
        try {
            localStorage.setItem('gilos_ribbon_dismissed', '1');
            sessionStorage.setItem('gilos_ribbon_dismissed', '1');
        } catch (e) {}
    }
</script>
<style>
    .app-ribbon {
        width: 100%;
        position: relative;
        z-index: 20;
        background: var(--surface-subtle);
        border-bottom: 1px solid var(--border-default);
        transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .ribbon-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 8px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .ribbon-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }

    .ribbon-icon {
        width: 28px;
        height: 28px;
        border-radius: 0px;
        border: 1px solid var(--border-default);
        flex-shrink: 0;
        object-fit: cover;
    }

    .ribbon-text {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
        min-width: 0;
    }

    .ribbon-title {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.01em;
    }

    .ribbon-subtitle {
        font-size: 0.825rem;
        color: var(--text-muted);
    }

    .ribbon-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
    }

    .ribbon-cta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--surface-elevated);
        color: var(--text);
        border: 1px solid var(--border-strong);
        padding: 6px 11px;
        border-radius: 0px;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-decoration: none;
        white-space: nowrap;
        transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.08s ease;
    }

    .ribbon-cta:hover {
        background: var(--accent-subtle);
        border-color: var(--accent);
        color: var(--accent);
    }

    .ribbon-cta:active {
        transform: translateY(1px);
    }

    .ribbon-cta:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .ribbon-close {
        width: 30px;
        height: 30px;
        padding: 0;
        margin: 0;
        border-radius: 0px;
        border: 1px solid var(--border-default);
        background: var(--surface-elevated);
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
    }

    .ribbon-close:hover {
        background: var(--surface-subtle);
        border-color: var(--border-strong);
        color: var(--text);
    }

    .ribbon-close:active {
        transform: translateY(1px);
    }

    .ribbon-close:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    @media (max-width: 600px) {
        .ribbon-inner {
            padding: 10px 16px;
        }
        .ribbon-subtitle {
            display: none;
        }
    }

    @media (max-width: 480px) {
        .ribbon-inner {
            padding: 8px 14px;
            gap: 10px;
        }
        .ribbon-cta {
            padding: 5px 9px;
            font-size: 0.74rem;
            gap: 5px;
        }
    }
</style>
{{end}}
